repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        # The README hero banner renders at 3000x1000 and is ~550 KB.
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-shebang-scripts-are-executable
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/Garulf/readwright
    rev: v0.5.0
    hooks:
      - id: readwright-check
        files: ^(README\.md|docs/README\.md\.j2|readme\.yaml|CHANGELOG\.md|\.github/assets/.*)$
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: .venv/bin/pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
